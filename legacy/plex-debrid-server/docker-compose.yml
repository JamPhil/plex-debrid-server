services:
  zurg:
    image: ghcr.io/debridmediamanager/zurg-testing:latest
    container_name: zurg
    restart: unless-stopped
    ports:
      - "9999:9999"
    volumes:
      - ./zurg/config.yml:/app/config.yml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9999/dav/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  rclone:
    image: rclone/rclone:latest
    container_name: rclone
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    devices:
      - /dev/fuse
    volumes:
      - ./rclone/rclone.conf:/config/rclone/rclone.conf:ro
      - /mnt/zurg:/data:rshared
    command: >
      mount zurg: /data
      --allow-other
      --allow-non-empty
      --dir-cache-time 10s
      --vfs-cache-mode minimal
      --vfs-read-chunk-size 8M
      --vfs-read-chunk-size-limit 64M
      --buffer-size 8M
      --poll-interval 30s
      --log-level INFO
    depends_on:
      zurg:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ls", "/data/movies"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    restart: unless-stopped
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE:-America/Chicago}
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM}
    volumes:
      - plex-config:/config
      - /mnt/zurg:/mnt/zurg:rslave
      
    depends_on:
      rclone:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:32400/identity"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  watchlist-sync:
    image: python:3.12-slim
    container_name: watchlist-sync
    restart: unless-stopped
    environment:
      - RD_API_TOKEN=${REAL_DEBRID_API_TOKEN}
      - PLEX_TOKEN=${PLEX_TOKEN}
      - PLEX_URL=http://174.138.35.189:32400
      - WATCHLIST_RSS=${WATCHLIST_RSS}
      - DISCORD_WEBHOOK=${DISCORD_WEBHOOK_URL}
      - TORRENTIO_PROXY=${TORRENTIO_PROXY}
      - TZ=${TIMEZONE:-America/Chicago}
    volumes:
      - ./scripts/watchlist-sync.py:/app/watchlist-sync.py:ro
      - watchlist-data:/app/data
    command: sh -c "pip install -q pysocks && python3 -u /app/watchlist-sync.py"
    depends_on:
      rclone:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import os,time; s=os.stat(\"/app/data/heartbeat\"); exit(0 if time.time()-s.st_mtime < 300 else 1)'"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  plex-config:
  watchlist-data:
