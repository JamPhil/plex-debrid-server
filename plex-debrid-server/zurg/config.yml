zurg: v1

token: YOUR_REAL_DEBRID_API_TOKEN_HERE
host: "0.0.0.0"
port: 9999

check_for_changes_every_secs: 10
enable_repair: true
auto_delete_rar_torrents: true

directories:
  shows:
    group_order: 10
    group: media
    filters:
      - has_episodes: true

  movies:
    group_order: 20
    group: media
    only_show_the_biggest_file: true
    filters:
      - regex: /.*/
