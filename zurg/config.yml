zurg: v1

# Token is set directly on the server (not from env vars — Zurg doesn't support interpolation)
token: YOUR_RD_TOKEN_HERE
host: "0.0.0.0"
port: 9999

check_for_changes_every_secs: 10
enable_repair: true
auto_delete_rar_torrents: true

# Required for blackhole script compatibility
retain_rd_torrent_name: true
retain_folder_name_extension: true

directories:
  shows:
    group_order: 10
    group: media
    filters:
      - has_episodes: true

  movies:
    group_order: 20
    group: media
    only_show_the_biggest_file: true
    filters:
      - regex: /.*/
