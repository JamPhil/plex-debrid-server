# =============================================================================
# Plex + Real-Debrid Streaming Server — *Arr Stack + Monitoring
# =============================================================================
# Architecture:
#   Request → Seerr/Doplarr → Sonarr/Radarr → Prowlarr → Decypharr → RD
#   RD → Decypharr (WebDAV + rclone) → /mnt/decypharr → Plex (/mnt/plex via symlinks)
#   Monitoring: cAdvisor + Node Exporter → Prometheus → Grafana → Discord
#   Plex Monitoring: Tautulli → Discord
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # STORAGE + RD BRIDGE — Decypharr (replaces Zurg + rclone + blackhole)
  # ---------------------------------------------------------------------------
  # Decypharr emulates qBittorrent API for Sonarr/Radarr integration.
  # Built-in: RD cache check, WebDAV server, rclone mount, symlink creation.
  # download_uncached=false rejects non-cached torrents instantly.
  # ---------------------------------------------------------------------------

  decypharr:
    image: cy01/blackhole:latest
    container_name: decypharr
    restart: unless-stopped
    ports:
      - "8282:8282"
    volumes:
      - decypharr-config:/app
      - /mnt:/mnt:rshared
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - RCLONE_DIR_CACHE_TIME=10s
      - RCLONE_VFS_CACHE_POLL_INTERVAL=10s
    healthcheck:
      test: ["CMD", "ls", "/mnt/decypharr/realdebrid/__all__"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

