  # ---------------------------------------------------------------------------
  # REQUEST LAYER — Seerr + Doplarr
  # ---------------------------------------------------------------------------

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    restart: unless-stopped
    init: true
    environment:
      - TZ=${TIMEZONE}
      - LOG_LEVEL=debug
    volumes:
      - seerr-config:/app/config
    ports:
      - "5055:5055"
    depends_on:
      plex:
        condition: service_healthy
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5055/api/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  doplarr:
    image: ghcr.io/kiranshila/doplarr:latest
    container_name: doplarr
    restart: unless-stopped
    environment:
      - TZ=${TIMEZONE}
      - OVERSEERR__URL=http://seerr:5055
      - OVERSEERR__API=${OVERSEERR_API_KEY}
      - DISCORD__TOKEN=${DOPLARR_DISCORD_TOKEN}
      - OVERSEERR__DEFAULT_ID=1
      - PARTIAL_SEASONS=true
    depends_on:
      seerr:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # PLEX MONITORING — Tautulli
  # ---------------------------------------------------------------------------

  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE}
    volumes:
      - tautulli-config:/config
    ports:
      - "8181:8181"
    depends_on:
      plex:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # METRICS COLLECTION
  # ---------------------------------------------------------------------------

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    command:
      - "--housekeeping_interval=30s"
      - "--docker_only=true"
      - "--disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory,resctrl,process"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      - "--collector.textfile.directory=/var/lib/node-exporter"
    volumes:
      - /:/host:ro,rslave
      - /var/lib/node-exporter:/var/lib/node-exporter:ro
    ports:
      - "9100:9100"

  # ---------------------------------------------------------------------------
  # METRICS STORAGE & VISUALIZATION
  # ---------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - cadvisor
      - node-exporter

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # ---------------------------------------------------------------------------
  # CONTAINER MANAGEMENT
  # ---------------------------------------------------------------------------

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  plex-config:
  decypharr-config:
  # zurg-data:  # deprecated
  prowlarr-config:
  sonarr-config:
  radarr-config:
  seerr-config:
  tautulli-config:
  prometheus-data:
  grafana-data:
